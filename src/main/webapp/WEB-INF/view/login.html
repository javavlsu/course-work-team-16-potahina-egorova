<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Arial, sans-serif;
          background-color: #f8f9fa;
          color: #333;
          line-height: 1.6;
        }

        .navbar {
          display: flex;
          align-items: center;
          background-color: #00b3a8;
          padding: 15px 20px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
          color: white;
          font-weight: bold;
          font-size: 1.5rem;
          margin-right: 30px;
        }

        .nav-item {
          color: white;
          padding: 10px 15px;
          text-decoration: none;
          border-radius: 4px;
          transition: background-color 0.3s;
        }

        .nav-main { background-color: #4CAF50; }
        .nav-achievements { background-color: #2196F3; }
        .nav-desktop { background-color: #FF9800; }
        .nav-profile { background-color: #9C27B0; }

        .nav-item:hover {
          opacity: 0.9;
          background-color: rgba(255, 255, 255, 0.2);
        }

        .content {
          padding: 20px;
          max-width: 1200px;
          margin: 0 auto;
        }

        .login-table {
          background-color: white;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
          overflow: hidden;
          margin: 20px 0;
          padding: 30px;
        }

        .table-header {
          background-color: #e8f4f3;
          padding: 15px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .add-task-btn {
          background-color: #00b3a8;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .add-task-btn:hover {
          background-color: #009a90;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.95rem;
        }

        thead {
          background-color: #00b3a8;
          color: white;
        }

        th {
          padding: 12px 10px;
          text-align: left;
          font-weight: 600;
        }

        tbody tr {
          border-bottom: 1px solid #eee;
          transition: background-color 0.2s;
        }

        tbody tr:hover {
          background-color: #f5f9f9;
        }

        td {
          padding: 12px 10px;
        }

        .status-pending { color: #ff9800; font-weight: 500; }
        .status-completed { color: #4CAF50; font-weight: 500; }
        .status-overdue { color: #f44336; font-weight: 500; }

        .actions {
          display: flex;
          gap: 8px;
        }

        .action-link {
          padding: 6px 12px;
          text-decoration: none;
          border-radius: 3px;
          font-size: 0.85rem;
        }

        .action-start { background-color: #8bc34a; color: white; }
        .action-edit { background-color: #2196f3; color: white; }
        .action-delete { background-color: #f44336; color: white; }

        .action-link:hover {
          opacity: 0.9;
        }

        .footer {
          background-color: #00b3a8;
          color: white;
          text-align: center;
          padding: 15px;
          position: fixed;
          bottom: 0;
          width: 100%;
          font-size: 0.9rem;
        }

        /* Стили для формы входа */
        .login-form label {
          display: block;
          margin-bottom: 8px;
          font-weight: 500;
          color: #555;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
          width: 100%;
          padding: 12px;
          margin-bottom: 20px;
          border: 1px solid #ddd;
          border-radius: 6px;
          font-size: 1rem;
          transition: border-color 0.3s;
        }

        .login-form input:focus {
          outline: none;
          border-color: #00b3a8;
        }

        .login-form button {
          width: 100%;
          padding: 12px;
          background-color: #00b3a8;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 1rem;
          cursor: pointer;
          transition: background-color 0.3s;
        }

        .login-form button:hover {
          background-color: #009a90;
        }

        .error-message {
          color: #f44336;
          margin: 15px 0;
          font-size: 0.9rem;
        }

        .register-link {
          display: inline-block;
          margin-top: 15px;
          color: #00b3a8;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .register-link:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <!--        <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />-->
            <p>TimeManagementApp</p>
        </div>
        <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>
    </div>

    <div class="content">
        <div class="login-table">
            <div class="table-header">
                <h2>Вход в систему</h2>
            </div>
            <form th:action="@{/login}" method="post" class="login-form">
                <div>
                    <label>Email: <input type="email" name="email" required></label>
                </div>
                <div>
                    <label>Пароль: <input type="password" name="password" required></label>
                </div>
                <button type="submit">Войти</button>
            </form>
            <div th:if="${error}" th:text="${error}" style="color: red;"></div>
            <a href="/tm_project2/register">Зарегистрироваться</a>
        </div>
    </div>

    <div class="footer">
        © Все-приложения, 2025
    </div>
</body>
</html>
