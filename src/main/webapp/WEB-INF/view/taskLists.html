<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title>Списки задач</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #00b3a8;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 30px;
    }

    .nav-item {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .nav-main { background-color: #4CAF50; }
    .nav-achievements { background-color: #2196F3; }
    .nav-desktop { background-color: #FF9800; }
    .nav-profile { background-color: #9C27B0; }

    .nav-item:hover {
      opacity: 0.9;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .taskLists-table {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 20px 0;
    }

    .table-header {
      background-color: #e8f4f3;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-task-btn {
      background-color: #00b3a8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .add-task-btn:hover {
      background-color: #009a90;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background-color: #00b3a8;
      color: white;
    }

    th {
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background-color: #f5f9f9;
    }

    td {
      padding: 12px 10px;
    }

    .status-pending { color: #ff9800; font-weight: 500; }
    .status-completed { color: #4CAF50; font-weight: 500; }
    .status-overdue { color: #f44336; font-weight: 500; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-link {
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 0.85rem;
    }

    .action-start { background-color: #8bc34a; color: white; }
    .action-edit { background-color: #2196f3; color: white; }
    .action-delete { background-color: #f44336; color: white; }

    .action-link:hover {
      opacity: 0.9;
    }

    .footer {
      background-color: #00b3a8;
      color: white;
      text-align: center;
      padding: 15px;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
    }
    .filters { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
    .filter-group { display: inline-block; margin-right: 15px; }
    .pagination { margin-top: 20px; text-align: center; }
    .page-link { margin: 0 5px; padding: 5px 10px; border: 1px solid #ddd; text-decoration: none; }
    .disabled { color: #6c757d; pointer-events: none; cursor: default; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
    </div>
    <a th:href="@{/dashboard}" href="dashboard.html" class="nav-item nav-main">Главная</a>
    <a th:href="@{/achievements}" href="achievements.html" class="nav-item nav-achievements">Достижения</a>
    <a th:href="@{/table}" href="table.html" class="nav-item nav-desktop">Рабочий стол</a>
    <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
  </div>

  <div class="content">
    <!-- ФОРМА ФИЛЬТРАЦИИ -->
    <form th:action="@{/taskLists}" method="get" class="filters">
      <div class="filter-group">
        <label>Поиск по названию:</label>
        <input type="text" name="search" th:value="${search}" placeholder="Введите название списка..." />
      </div>
      <button type="submit">Применить</button>
      <a th:href="@{/taskLists}" class="button">Сбросить</a>
    </form>

    <div class="taskLists-table">
      <div class="table-header">
        <h2>Списки задач</h2>
        <a th:href="@{/taskLists/add}">Создать новый список задач</a>
      </div>
      <table border="1" name="tasklists">
        <thead>
        <tr>
          <th>ID</th>
          <th>Название</th>
          <th>Создатель</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(taskLists)}">
          <td colspan="4" style="text-align: center; padding: 20px;">
            Списков задач не найдено
          </td>
        </tr>
        <tr th:each="tl : ${taskLists}">
          <td th:text="${tl.id}"></td>
          <td th:text="${tl.title}"></td>
          <td th:text="${tl.user != null ? tl.user.name : 'Не указан'}"></td>
          <td>
            <a th:href="@{'/taskLists/edit?id='+${tl.id}}">Редактировать</a>
            <a th:href="@{'/taskLists/delete?id='+${tl.id}}"
               onclick="return confirm('Удалить список задач?');">Удалить</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- БЛОК ПАГИНАЦИИ -->
    <div class="pagination">
      <!-- Информация о текущей странице -->
      <div class="page-info" th:with="start=${currentPage * pageSize + 1},
                                   end=${T(java.lang.Math).min((currentPage + 1) * pageSize, totalElements)}">
        <span th:text="|${start}-${end} из ${totalElements}|"></span>
      </div>

      <!-- Навигация по страницам -->
      <ul class="pagination-list">
        <!-- Кнопка «Назад» -->
        <li th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link"
             th:if="${currentPage > 0}"
             th:href="@{/taskLists(page=${currentPage - 1}, size=${pageSize}, search=${search})}">
            &laquo; Назад
          </a>
          <span class="page-link disabled" th:if="${currentPage == 0}">
            &laquo; Назад
          </span>
        </li>

        <!-- Номера страниц -->
        <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${pageNum == currentPage} ? 'active'">
          <a class="page-link"
             th:if="${pageNum!= currentPage}"
             th:href="@{/taskLists(page=${pageNum}, size=${pageSize}, search=${search})"
             th:text="${pageNum + 1}"></a>
          <span class="page-link active" th:if="${pageNum == currentPage}"
                th:text="${pageNum + 1}"></span>
        </li>
      </ul>

      <!-- Кнопка «Вперёд» -->
      <li th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
        <a class="page-link"
           th:if="${currentPage < totalPages - 1}"
           th:href="@{/taskLists(page=${currentPage + 1}, size=${pageSize}, search=${search})}">
          Вперёд &raquo;
        </a>
        <span class="page-link disabled" th:if="${currentPage >= totalPages - 1}">
          Вперёд &raquo;
        </span>
      </li>
      </ul>

      <!-- Выбор количества элементов на странице -->
      <div class="page-size-selector">
        <label>Списков на странице:</label>
        <select onchange="changePageSize(this.value)">
          <option th:each="sizeOption : ${ {5, 10, 20, 50} }"
                  th:value="${sizeOption}"
                  th:text="${sizeOption}"
                  th:selected="${sizeOption == pageSize}"></option>
        </select>
      </div>
    </div>
  </div>

  <div class="footer">
    © Все-приложения, 2025
  </div>

  <!-- JavaScript для изменения размера страницы -->
  <script>
    function changePageSize(newSize) {
      const url = new URL(window.location.href);
      url.searchParams.set('size', newSize);
      url.searchParams.set('page', '0'); // сбрасываем на первую страницу
      window.location.href = url.toString();
    }
  </script>
</body>
</html>
