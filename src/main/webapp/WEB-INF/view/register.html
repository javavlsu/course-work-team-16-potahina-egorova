<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Arial, sans-serif;
          background-color: #f8f9fa;
          color: #333;
          line-height: 1.6;
        }

        .navbar {
          display: flex;
          align-items: center;
          background-color: #00b3a8;
          padding: 15px 20px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
          color: white;
          font-weight: bold;
          font-size: 1.5rem;
          margin-right: 30px;
        }

        .nav-item {
          color: white;
          padding: 10px 15px;
          text-decoration: none;
          border-radius: 4px;
          transition: background-color 0.3s;
        }

        .nav-main { background-color: #4CAF50; }
        .nav-achievements { background-color: #2196F3; }
        .nav-desktop { background-color: #FF9800; }
        .nav-profile { background-color: #9C27B0; }

        .nav-item:hover {
          opacity: 0.9;
          background-color: rgba(255, 255, 255, 0.2);
        }

        .content {
          padding: 20px;
          max-width: 1200px;
          margin: 0 auto;
        }

        .register-table {
          background-color: white;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
          overflow: hidden;
          margin: 20px 0;
          padding: 30px;
        }

        .table-header {
          background-color: #e8f4f3;
          padding: 15px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .add-task-btn {
          background-color: #00b3a8;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .add-task-btn:hover {
          background-color: #009a90;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.95rem;
        }

        thead {
          background-color: #00b3a8;
          color: white;
        }

        th {
          padding: 12px 10px;
          text-align: left;
          font-weight: 600;
        }

        tbody tr {
          border-bottom: 1px solid #eee;
          transition: background-color 0.2s;
        }

        tbody tr:hover {
          background-color: #f5f9f9;
        }

        td {
          padding: 12px 10px;
        }

        .status-pending { color: #ff9800; font-weight: 500; }
        .status-completed { color: #4CAF50; font-weight: 500; }
        .status-overdue { color: #f44336; font-weight: 500; }

        .actions {
          display: flex;
          gap: 8px;
        }

        .action-link {
          padding: 6px 12px;
          text-decoration: none;
          border-radius: 3px;
          font-size: 0.85rem;
        }

        .action-start { background-color: #8bc34a; color: white; }
        .action-edit { background-color: #2196f3; color: white; }
        .action-delete { background-color: #f44336; color: white; }

        .action-link:hover {
          opacity: 0.9;
        }

        .footer {
            background-color: #00b3a8;
            color: white;
            text-align: center;
            padding: 15px;
            position: sticky;
            bottom: 0;
            width: 100%;
            font-size: 0.9rem;
            margin-top: auto;
        }

        /* Стили для формы входа */
        .register-form label {
          display: block;
          margin-bottom: 8px;
          font-weight: 500;
          color: #555;
        }

        .register-form input[type="email"],
        .register-form input[type="password"],
        .register-form input[type="text"] {
          width: 100%;
          padding: 12px;
          margin-bottom: 20px;
          border: 1px solid #ddd;
          border-radius: 6px;
          font-size: 1rem;
          transition: border-color 0.3s;
        }

        .register-form input:focus {
          outline: none;
          border-color: #00b3a8;
        }

        .register-form button {
          width: 100%;
          padding: 12px;
          background-color: #00b3a8;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 1rem;
          cursor: pointer;
          transition: background-color 0.3s;
        }

        .register-form button:hover {
          background-color: #009a90;
        }

        .error-message {
          color: #f44336;
          margin: 15px 0;
          font-size: 0.9rem;
        }

        .register-link {
          display: inline-block;
          margin-top: 15px;
          color: #00b3a8;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .register-link:hover {
          text-decoration: underline;
        }

        .validation-hints {
            background-color: #e8f4f3;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        .validation-hints h4 {
            color: #00b3a8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">
        <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
    </div>
    <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>
</div>

<div class="content">
    <div class="register-table">
        <div class="table-header">
            <h2>Регистрация</h2>
        </div>
        <form th:action="@{/register}" method="post" class="register-form" id="registerForm">
            <div>
                <label>Имя:</label>
                <input type="text" name="name" required>
            </div>
            <div class="validation-hints">
                <h4>Требования к паролю:</h4>
                <ul>
                    <li>Минимум 5 цифр</li>
                    <li>Минимум 2 буквы</li>
                    <li>Хотя бы 1 специальный символ (!@#$% и т. д.)</li>
                </ul>
            </div>
            <div>
                <label>Пароль:</label>
                <input type="password" name="password" required
                       pattern="(?=.*\d{5,})(?=.*[a-zA-Z]{2,})(?=.*[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]).*"
                       title="Минимум 5 цифр, 2 буквы, 1 спецсимвол">
                <div class="error-message" id="passwordError"></div>
            </div>
            <div>
                <label>Email:</label>
                <input type="email" name="email" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div>
                <label>Телефон:</label>
                <input type="tel" name="phoneNumber" required
                       placeholder="+7 (XXX) XXX-XX-XX">
                <div class="error-message" id="phoneError"></div>
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div th:if="${error}" th:text="${error}" style="color: red;"></div>
        <a href="/tm_project2/login">Войти</a>
    </div>
</div>

<div class="footer">
    © Все-приложения, 2025
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        let isValid = true;

        // Валидация пароля
        const password = document.querySelector('input[name="password"]').value;
        const passwordError = document.getElementById('passwordError');
        const passwordRegex = /(?=.*\d{5,})(?=.*[a-zA-Z]{2,})(?=.*[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]).*/;
        if (!passwordRegex.test(password)) {
            passwordError.textContent = 'Пароль должен содержать минимум 5 цифр, 2 буквы и 1 спецсимвол';
            isValid = false;
        } else {
            passwordError.textContent = '';
        }

        // Валидация телефона
        const phone = document.querySelector('input[name="phoneNumber"]').value;
        const phoneError = document.getElementById('phoneError');
        const phoneRegex = /^\+7\s?\(\d{3}\)\s?\d{3}-\d{2}-\d{2}$|^\+7\d{10}$/;
        if (!phoneRegex.test(phone)) {
            phoneError.textContent = 'Введите российский номер в формате +7 (XXX) XXX-XX-XX';
            isValid = false;
        } else {
            phoneError.textContent = '';
        }

        if (!isValid) {
            e.preventDefault();
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.querySelector('input[name="email"]');
        const phoneInput = document.querySelector('input[name="phoneNumber"]');

        emailInput.addEventListener('blur', function() {
            checkUniqueness('email', this.value, 'emailError');
        });

        phoneInput.addEventListener('blur', function() {
            checkUniqueness('phone', this.value, 'phoneError');
        });
    });

    async function checkUniqueness(type, value, errorElementId) {
        if (!value) return;

        try {
            const response = await fetch(`/api/check-unique?type=${type}&value=${encodeURIComponent(value)}`);
            const data = await response.json();

            const errorElement = document.getElementById(errorElementId);
            if (!data.unique) {
                errorElement.textContent = data.message;
            } else {
                errorElement.textContent = '';
            }
        } catch (error) {
            console.error('Ошибка проверки уникальности:', error);
        }
    }
</script>
</body>
</html>
