<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Список пользователей</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Arial, sans-serif;
          background-color: #f8f9fa;
          color: #333;
          line-height: 1.6;
        }

        .navbar {
          display: flex;
          align-items: center;
          background-color: #00b3a8;
          padding: 15px 20px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
          color: white;
          font-weight: bold;
          font-size: 1.5rem;
          margin-right: 30px;
        }

        .nav-item {
          color: white;
          padding: 10px 15px;
          text-decoration: none;
          border-radius: 4px;
          transition: background-color 0.3s;
        }

        .nav-main { background-color: #4CAF50; }
        .nav-tasks { background-color: #2196F3; }
        .nav-task-lists { background-color: #FF9800; }
        .nav-profile { background-color: #9C27B0; }
        .nav-notifications { background-color: #CCCCFF; }

        .nav-item:hover {
          opacity: 0.9;
          background-color: rgba(255, 255, 255, 0.2);
        }

        .content {
          padding: 20px;
          max-width: 1200px;
          margin: 0 auto;
        }

        .users-table {
          background-color: white;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
          overflow: hidden;
          margin: 20px 0;
        }

        .table-header {
          background-color: #e8f4f3;
          padding: 15px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .add-task-btn {
          background-color: #00b3a8;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .add-task-btn:hover {
          background-color: #009a90;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.95rem;
        }

        thead {
          background-color: #00b3a8;
          color: white;
        }

        th {
          padding: 12px 10px;
          text-align: left;
          font-weight: 600;
        }

        tbody tr {
          border-bottom: 1px solid #eee;
          transition: background-color 0.2s;
        }

        tbody tr:hover {
          background-color: #f5f9f9;
        }

        td {
          padding: 12px 10px;
        }

        .status-pending { color: #ff9800; font-weight: 500; }
        .status-completed { color: #4CAF50; font-weight: 500; }
        .status-overdue { color: #f44336; font-weight: 500; }

        .actions {
          display: flex;
          gap: 8px;
        }

        .action-link {
          padding: 6px 12px;
          text-decoration: none;
          border-radius: 3px;
          font-size: 0.85rem;
        }

        .action-friendship { background-color: #8bc34a; color: white; }

        .action-link:hover {
          opacity: 0.9;
        }

        .footer {
          background-color: #00b3a8;
          color: white;
          text-align: center;
          padding: 15px;
          position: fixed;
          bottom: 0;
          width: 100%;
          font-size: 0.9rem;
        }

        .filters { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .filter-group { display: inline-block; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
        </div>
        <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>
        <a th:href="@{/tasks}" href="tasks.html" class="nav-item nav-tasks">Задачи</a>
        <a th:href="@{/taskLists}" href="taskLists.html" class="nav-item nav-task-lists">Списки задач</a>
        <a th:href="@{/notifications}" href="notifications.html" class="nav-item nav-notifications">Уведомления</a>
        <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
    </div>

    <div class="content">
        <!-- ФОРМА ФИЛЬТРАЦИИ -->
        <form th:action="@{/users}" method="get" class="filters">
            <div class="filter-group">
                <label>ID пользователя:</label>
                <input type="number" name="userId" th:value="${userId}" placeholder="Введите ID" />
            </div>
            <div class="filter-group">
                <label>Никнейм:</label>
                <input type="text" name="name" th:value="${name}" placeholder="Введите никнейм" />
            </div>
            <div class="filter-group">
                <label>Email:</label>
                <input type="email" name="email" th:value="${email}" placeholder="Введите email" />
            </div>
            <button type="submit">Найти</button>
            <a th:href="@{/users}" class="button">Сбросить</a>
        </form>

        <div class="users-table">
            <div class="table-header">
            <h2>Пользователи</h2>
            </div>

            <table border="1">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Никнейм</th>
                    <th>Электронная почта</th>
                    <th>Количество набранных баллов</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.name}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.totalPoints}"></td>
                        <td>
                            <a th:href="@{/users/profile/{id}(id=${u.id})}" class="btn-view"
                               style="color: #1E90FF; text-decoration: underline;">Перейти в профиль</a>

                            <!-- Условное отображение: кнопка или текст -->
                            <span th:if="${friendsStatus[u.id]}" style="color: green; font-weight: bold;">
                            Ваш друг
                            </span>
                            <form th:unless="${friendsStatus[u.id]}"
                                  th:action="@{/users/send-friend-request/{id}(id=${u.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="action-link action-friendship">
                                    Добавить в друзья
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        © Все-приложения, 2025
    </div>
</body>
</html>
