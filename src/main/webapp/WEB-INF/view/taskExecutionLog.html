<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выполнить задачу</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #00b3a8;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 30px;
    }

    .nav-item {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .nav-main { background-color: #4CAF50; }
    .nav-tasks { background-color: #2196F3; }
    .nav-task-lists { background-color: #FF9800; }
    .nav-profile { background-color: #9C27B0; }
    .nav-notifications { background-color: #CCCCFF; }

    .nav-item:hover {
      opacity: 0.9;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .task-execution-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 20px 0;
      padding: 20px;
    }

    .card-header {
      background-color: #e8f4f3;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .media-section {
      margin: 25px 0;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #eee;
    }

    .media-selector {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .player-container {
      margin-top: 10px;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }

    audio, video {
      width: 100%;
    }

    .execution-controls {
      margin-top: 25px;
      padding: 20px;
      background: #f0f8ff;
      border-radius: 8px;
      border-left: 4px solid #00b3a8;
    }

    .timer-display {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
      color: #333;
      text-align: center;
    }

    .control-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .save-button {
      background-color: #ff4500;
      color: white;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9rem;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
    }

    .start-timer-btn {
      background-color: #28a745;
    }

    .complete-task-btn {
      background-color: #dc3545;
    }

    .save-button:hover {
      opacity: 0.9;
    }

    h2 {
      color: #00b3a8;
      margin-bottom: 20px;
    }

    h3 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .footer {
      background-color: #00b3a8;
      color: white;
      text-align: center;
      padding: 15px;
      position: sticky;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
      margin-top: auto;
    }

    .timer-controls {
      margin-top: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    .mode-selection {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
    }

    .mode-selection label {
        font-weight: 500;
        color: #333;
        margin-right: 10px;
    }

    #timerDisplay {
        transition: color 0.3s ease;
    }

    #phaseDisplay {
        font-style: italic;
        font-size: 14px;
    }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">
    <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
  </div>
  <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>
  <a th:href="@{/tasks}" href="tasks.html" class="nav-item nav-tasks">Задачи</a>
  <a th:href="@{/taskLists}" href="taskLists.html" class="nav-item nav-task-lists">Списки задач</a>
  <a th:href="@{/notifications}" href="notifications.html" class="nav-item nav-notifications">Уведомления</a>
  <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
</div>

<div class="content">
  <div class="task-execution-card">
    <div class="card-header">
      <h2>Выполнить задачу: <span th:text="${log.task.title}"></span></h2>
      <a th:href="@{/tasks}"
         class="btn-view"
         style="color: #FF8C00; text-decoration: underline;">
        Вернуться к задачам
      </a>
    </div>

    <!-- Форма для сохранения выбора медиа -->
    <form th:action="@{/tasks/task-execution/save-media/{logId}(logId=${log.id})}" th:object="${log}" method="post">
      <input type="hidden" th:field="*{id}"/>

      <div class="media-section">
        <h3>Фоновая музыка</h3>
        <select th:field="*{musicMedia.id}"
                th:onchange="updateAudioPlayer(this.value)"
                class="media-selector">
          <option value="">Без музыки</option>
          <option th:each="music : ${musicMediaList}"
                  th:value="${music.id}"
                  th:text="${music.name}">
          </option>
        </select>
        <div id="audio-player-container" class="player-container">
          <audio id="audio-player" controls>
            <source id="audio-source" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоэлемент.
          </audio>
        </div>
      </div>

      <div class="media-section">
        <h3>Визуальное сопровождение</h3>
        <select th:field="*{visualMedia.id}"
                th:onchange="updateVideoPlayer(this.value)"
                class="media-selector">
          <option value="">Без видео</option>
          <option th:each="video : ${visualMediaList}"
                  th:value="${video.id}"
                  th:text="${video.name}">
          </option>
        </select>
        <div id="video-player-container" class="player-container">
          <video id="video-player" controls width="100%" height="300">
            <source id="video-source" type="video/mp4">
            Ваш браузер не поддерживает видеоэлемент.
          </video>
        </div>
      </div>

      <button type="submit" class="save-button">Сохранить выбор медиа</button>
    </form>


    <div class="timer-controls">
      <h3>Таймер</h3>
      <div class="mode-selection">
        <label for="timerMode">Режим таймера:</label>
        <select id="timerMode" class="save-button" style="margin-left: 10px;">
          <option th:each="mode : ${timerModes}"
                  th:value="${mode.id}"
                  th:text="${mode.modeName}">
          </option>
        </select>
      </div>

      <div id="timerDisplay" style="font-size: 32px; font-weight: bold; margin: 15px 0; color: #333;">00:00</div>
      <div id="phaseDisplay" style="font-size: 16px; margin-bottom: 15px; color: #666;"></div>

      <button id="startTimerBtn" class="save-button" style="background-color: #28a745;">Запустить таймер</button>
      <button id="pauseTimerBtn" class="save-button" style="background-color: #ffc107; display: none;">Пауза</button>
      <button id="resetTimerBtn" class="save-button" style="background-color: #6c757d;">Сброс</button>
      <a th:href="@{/tasks/complete-execution(logId=${log.id})}"
         class="save-button complete-task-btn">
        Завершить задачу
      </a>
      <a th:href="@{/tasks}"
         class="btn-view"
         style="color: #FF8C00; text-decoration: underline;">
        Вернуться к задачам
      </a>
    </div>

<!--    <div class="execution-controls">-->
<!--      <h3>Управление задачей</h3>-->
<!--      <div class="control-buttons">-->
<!--        <button id="startTimerBtn" class="save-button start-timer-btn" onclick="startTimer()">-->
<!--          Запустить таймер-->
<!--        </button>-->
<!--        <div id="timerDisplay" class="timer-display" style="display: none;">00:00</div>-->
<!--        <a th:href="@{/tasks/complete-execution(logId=${log.id})}"-->
<!--           class="save-button complete-task-btn">-->
<!--          Завершить задачу-->
<!--        </a>-->
<!--        <a th:href="@{/tasks}"-->
<!--           class="btn-view"-->
<!--           style="color: #FF8C00; text-decoration: underline;">-->
<!--          Вернуться к задачам-->
<!--        </a>-->
<!--      </div>-->
<!--    </div>-->
  </div>
</div>
</div>

<div class="footer">
  © Все-приложения, 2025
</div>


<script th:inline="javascript">
  let timerInterval;
  let currentTime = 0;
  let isRunning = false;
  let isPaused = false;
  let currentPhase = 'work'; // work, short_break, long_break
  let phaseIndex = 0;
  const phases = ['work', 'short_break', 'work', 'long_break'];
  let selectedMode = null;

  // th:inline="javascript" корректно преобразует список из Spring в массив JSON
  const timerModesData = [[${timerModes}]];

  document.addEventListener('DOMContentLoaded', function() {
    const modeSelect = document.getElementById('timerMode');

    // Инициализируем режимы, если они пришли с сервера
    if (timerModesData && timerModesData.length > 0) {
      selectedMode = timerModesData[0];
      updatePhaseDisplay();
    }

    // Обработчик смены режима
    modeSelect.addEventListener('change', function() {
      const modeId = parseInt(this.value);
      selectedMode = timerModesData.find(mode => mode.id === modeId);
      resetTimer();
      updatePhaseDisplay();
    });

    // Инициализация медиаплееров
    const initialMusicId = [[${log.musicMedia?.id}]];
    const initialVideoId = [[${log.visualMedia?.id}]];

    if (initialMusicId) updateAudioPlayer(initialMusicId);
    if (initialVideoId) updateVideoPlayer(initialVideoId);
  });

  function startTimer() {
    if (!selectedMode) {
      alert('Выберите режим таймера!');
      return;
    }

    // Если таймер был на паузе — снимаем с паузы и запускаем отсчёт
    if (isPaused) {
      isPaused = false;
      isRunning = true;
      document.getElementById('pauseTimerBtn').style.display = 'inline-block';
      document.getElementById('startTimerBtn').style.display = 'none';
      // Запускаем интервал отсчёта — ключевое исправление
      timerInterval = setInterval(() => {
        if (currentTime <= 0) {
          clearInterval(timerInterval);
          phaseIndex++;
          if (phaseIndex >= phases.length) {
            phaseIndex = 0;
          }
          currentPhase = phases[phaseIndex];
          updatePhaseDisplay();
          setTimeout(startPhase, 1000);
        } else {
          currentTime--;
          updateTimerDisplay();
        }
      }, 1000);
      return;
    }

  // Если таймер полностью остановлен — запускаем фазу с нуля
  if (!isRunning) {
    isRunning = true;
    document.getElementById('pauseTimerBtn').style.display = 'inline-block';
    document.getElementById('startTimerBtn').style.display = 'none';
    startPhase();
  }
}

  function pauseTimer() {
    isPaused = true;
    isRunning = false;
    clearInterval(timerInterval);
    document.getElementById('pauseTimerBtn').style.display = 'none';
    document.getElementById('startTimerBtn').style.display = 'inline-block';
    document.getElementById('startTimerBtn').textContent = 'Продолжить';
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    isPaused = false;
    currentPhase = 'work';
    phaseIndex = 0;
    updatePhaseDisplay();
    document.getElementById('timerDisplay').textContent = '00:00';
    document.getElementById('pauseTimerBtn').style.display = 'none';

    const startBtn = document.getElementById('startTimerBtn');
    startBtn.style.display = 'inline-block';
    startBtn.textContent = 'Запустить таймер';
  }

  function startPhase() {
    let durationInMinutes = 0;

    // Используем поддержку обоих вариантов написания, так как формат
    // зависит от настроек Jackson конвертера в Spring Boot
    switch (currentPhase) {
      case 'work':
        durationInMinutes = selectedMode.workDurationMin || selectedMode.work_duration_min;
        break;
      case 'short_break':
        durationInMinutes = selectedMode.shortBreakMin || selectedMode.short_break_min;
        break;
      case 'long_break':
        durationInMinutes = selectedMode.longBreakMin || selectedMode.long_break_min;
        break;
    }

    currentTime = durationInMinutes * 60;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      if (currentTime <= 0) {
        clearInterval(timerInterval);
        phaseIndex++;

        // Если прошли все 4 фазы — перезапускаем цикл
        if (phaseIndex >= phases.length) {
          phaseIndex = 0;
        }

        currentPhase = phases[phaseIndex];
        updatePhaseDisplay();

        // Автоматически начинаем следующую фазу через 1 секунду
        setTimeout(startPhase, 1000);
      } else {
        currentTime--;
        updateTimerDisplay();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const minutes = Math.floor(currentTime / 60);
    const seconds = currentTime % 60;

    document.getElementById('timerDisplay').textContent =
      String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function updatePhaseDisplay() {
    const phaseDisplay = document.getElementById('phaseDisplay');
    const timerDisplay = document.getElementById('timerDisplay');

    let phaseName = '';
    switch (currentPhase) {
      case 'work':
        phaseName = 'Работа';
        timerDisplay.style.color = '#28a745';
        break;
      case 'short_break':
        phaseName = 'Короткий перерыв';
        timerDisplay.style.color = '#ffc107';
        break;
      case 'long_break':
        phaseName = 'Длинный перерыв';
        timerDisplay.style.color = '#17a2b8';
        break;
    }

    phaseDisplay.textContent = `Фаза: ${phaseName}`;
  }

  // Привязка кнопок
  document.getElementById('startTimerBtn').addEventListener('click', startTimer);
  document.getElementById('pauseTimerBtn').addEventListener('click', pauseTimer);
  document.getElementById('resetTimerBtn').addEventListener('click', resetTimer);

  window.addEventListener('beforeunload', function() {
    clearInterval(timerInterval);
  });

  // Функции медиаплеера оставляем без изменений
  function updateAudioPlayer(musicId) {
    const audioPlayer = document.getElementById('audio-player');
    const audioSource = document.getElementById('audio-source');

    if (!musicId) {
      audioPlayer.style.display = 'none';
      return;
    }

    fetch('/api/music/' + musicId)
      .then(response => response.json())
      .then(data => {
        audioSource.src = convertGoogleDriveUrl(data.url);
        audioPlayer.load();
        audioPlayer.style.display = 'block';
      })
      .catch(error => {
        console.error('Ошибка загрузки аудио:', error);
      });
  }

  function updateVideoPlayer(videoId) {
    const videoPlayer = document.getElementById('video-player');
    const videoSource = document.getElementById('video-source');

    if (!videoId) {
      videoPlayer.style.display = 'none';
      return;
    }

    fetch('/api/video/' + videoId)
      .then(response => response.json())
      .then(data => {
        videoSource.src = convertGoogleDriveUrl(data.url);
        videoPlayer.load();
        videoPlayer.style.display = 'block';
      })
      .catch(error => {
        console.error('Ошибка загрузки видео:', error);
      });
  }

  function convertGoogleDriveUrl(driveUrl) {
    const match = driveUrl.match(/\/d\/([^\/]+)\//);
    if (match && match[1]) {
      return 'https://drive.google.com/uc?export=download&id=' + match[1];
    }
    return driveUrl;
  }
</script>
</body>
</html>
