<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выполнить задачу</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #00b3a8;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 30px;
    }

    .nav-item {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .nav-main { background-color: #4CAF50; }
    .nav-tasks { background-color: #2196F3; }
    .nav-task-lists { background-color: #FF9800; }
    .nav-profile { background-color: #9C27B0; }

    .nav-item:hover {
      opacity: 0.9;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .task-execution-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 20px 0;
      padding: 20px;
    }

    .card-header {
      background-color: #e8f4f3;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .media-section {
      margin: 25px 0;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #eee;
    }

    .media-selector {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .player-container {
      margin-top: 10px;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }

    audio, video {
      width: 100%;
    }

    .execution-controls {
      margin-top: 25px;
      padding: 20px;
      background: #f0f8ff;
      border-radius: 8px;
      border-left: 4px solid #00b3a8;
    }

    .timer-display {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
      color: #333;
      text-align: center;
    }

    .control-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .save-button {
      background-color: #ff4500;
      color: white;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9rem;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
    }

    .start-timer-btn {
      background-color: #28a745;
    }

    .complete-task-btn {
      background-color: #dc3545;
    }

    .save-button:hover {
      opacity: 0.9;
    }

    h2 {
      color: #00b3a8;
      margin-bottom: 20px;
    }

    h3 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .footer {
      background-color: #00b3a8;
      color: white;
      text-align: center;
      padding: 15px;
      position: sticky;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">
    <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
  </div>
  <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>
  <a th:href="@{/tasks}" href="tasks.html" class="nav-item nav-tasks">Задачи</a>
  <a th:href="@{/taskLists}" href="taskLists.html" class="nav-item nav-task-lists">Списки задач</a>
  <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
</div>

<div class="content">
  <div class="task-execution-card">
    <div class="card-header">
      <h2>Выполнить задачу: <span th:text="${log.task.title}"></span></h2>
      <a th:href="@{/tasks}"
         class="btn-view"
         style="color: #FF8C00; text-decoration: underline;">
        Вернуться к задачам
      </a>
    </div>

    <!-- Форма для сохранения выбора медиа -->
    <form th:action="@{/tasks/task-execution/save-media/{logId}(logId=${log.id})}" th:object="${log}" method="post">
      <input type="hidden" th:field="*{id}"/>

      <div class="media-section">
        <h3>Фоновая музыка</h3>
        <select th:field="*{musicMedia.id}"
                th:onchange="updateAudioPlayer(this.value)"
                class="media-selector">
          <option value="">Без музыки</option>
          <option th:each="music : ${musicMediaList}"
                  th:value="${music.id}"
                  th:text="${music.name}">
          </option>
        </select>
        <div id="audio-player-container" class="player-container">
          <audio id="audio-player" controls>
            <source id="audio-source" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоэлемент.
          </audio>
        </div>
      </div>

      <div class="media-section">
        <h3>Визуальное сопровождение</h3>
        <select th:field="*{visualMedia.id}"
                th:onchange="updateVideoPlayer(this.value)"
                class="media-selector">
          <option value="">Без видео</option>
          <option th:each="video : ${visualMediaList}"
                  th:value="${video.id}"
                  th:text="${video.name}">
          </option>
        </select>
        <div id="video-player-container" class="player-container">
          <video id="video-player" controls width="100%" height="300">
            <source id="video-source" type="video/mp4">
            Ваш браузер не поддерживает видеоэлемент.
          </video>
        </div>
      </div>

      <button type="submit" class="save-button">Сохранить выбор медиа</button>
    </form>

    <div class="execution-controls">
      <h3>Управление задачей</h3>
      <div class="control-buttons">
        <button id="startTimerBtn" class="save-button start-timer-btn" onclick="startTimer()">
          Запустить таймер
        </button>
        <div id="timerDisplay" class="timer-display" style="display: none;">00:00</div>
        <a th:href="@{/tasks/complete-execution(logId=${log.id})}"
           class="save-button complete-task-btn">
          Завершить задачу
        </a>
        <a th:href="@{/tasks}"
           class="btn-view"
           style="color: #FF8C00; text-decoration: underline;">
          Вернуться к задачам
        </a>
      </div>
    </div>
  </div>
</div>
</div>

<div class="footer">
  © Все-приложения, 2025
</div>

<script>
  // Простой скрипт таймера
  let timerInterval;
  function startTimer() {
    const display = document.getElementById('timerDisplay');
    const btn = document.getElementById('startTimerBtn');

    display.style.display = 'block';
    btn.textContent = 'Таймер запущен';
    btn.disabled = true;
    btn.style.backgroundColor = '#6c757d';

    let seconds = 0;
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      seconds++;
      let mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      let secs = String(seconds % 60).padStart(2, '0');
      display.textContent = mins + ':' + secs;
    }, 1000);
  }

  function updateAudioPlayer(musicId) {
    const audioPlayer = document.getElementById('audio-player');
    const audioSource = document.getElementById('audio-source');

    if (!musicId) {
      audioPlayer.style.display = 'none';
      return;
    }

    fetch('/api/music/' + musicId)
      .then(response => response.json())
      .then(data => {
        audioSource.src = convertGoogleDriveUrl(data.url);
        audioPlayer.load();
        audioPlayer.style.display = 'block';
      })
      .catch(error => {
        console.error('Ошибка загрузки аудио:', error);
        alert('Не удалось загрузить аудиофайл');
      });
  }

  function updateVideoPlayer(videoId) {
    const videoPlayer = document.getElementById('video-player');
    const videoSource = document.getElementById('video-source');

    if (!videoId) {
      videoPlayer.style.display = 'none';
      return;
    }

    fetch('/api/video/' + videoId)
      .then(response => response.json())
      .then(data => {
        videoSource.src = convertGoogleDriveUrl(data.url);
        videoPlayer.load();
        videoPlayer.style.display = 'block';
      })
      .catch(error => {
        console.error('Ошибка загрузки видео:', error);
        alert('Не удалось загрузить видеофайл');
      });
  }

  // Функция для преобразования Google Drive ссылок
  function convertGoogleDriveUrl(driveUrl) {
    // Извлекаем ID файла из ссылки
    const match = driveUrl.match(/\/d\/([^\/]+)\//);
    if (match && match[1]) {
      return 'https://drive.google.com/uc?export=download&id=' + match[1];
    }
    return driveUrl; // если не Google Drive, возвращаем оригинальную ссылку
  }

  // Инициализация при загрузке страницы
  document.addEventListener('DOMContentLoaded', function() {
    const initialMusicId = [[${log.musicMedia?.id}]];
    const initialVideoId = [[${log.visualMedia?.id}]];

    if (initialMusicId) {
      updateAudioPlayer(initialMusicId);
    }
    if (initialVideoId) {
      updateVideoPlayer(initialVideoId);
    }
  });
</script>
</body>
</html>
