<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title th:text="${taskList.title} + ' — Задачи'"></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #00b3a8;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 30px;
    }

    .nav-item {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .nav-main { background-color: #4CAF50; }
    .nav-achievements { background-color: #2196F3; }
    .nav-desktop { background-color: #FF9800; }
    .nav-profile { background-color: #9C27B0; }

    .nav-item:hover {
      opacity: 0.9;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tasks-table {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 20px 0;
    }

    .table-header {
      background-color: #e8f4f3;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background-color: #00b3a8;
      color: white;
    }

    th {
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background-color: #f5f9f9;
    }

    td {
      padding: 12px 10px;
    }

    .status-pending { color: #ff9800; font-weight: 500; }
    .status-completed { color: #4CAF50; font-weight: 500; }
    .status-overdue { color: #f44336; font-weight: 500; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-link {
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 0.85rem;
    }

    .action-start { background-color: #8bc34a; color: white; }
    .action-edit { background-color: #2196f3; color: white; }
    .action-delete { background-color: #f44336; color: white; }

    .action-link:hover {
      opacity: 0.9;
    }

    .footer {
      background-color: #00b3a8;
      color: white;
      text-align: center;
      padding: 15px;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #00b3a8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">
    <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />
  </div>
  <a th:href="@{/dashboard}" href="dashboard.html" class="nav-item nav-main">Главная</a>
  <a th:href="@{/achievements}" href="achievements.html" class="nav-item nav-achievements">Достижения</a>
  <a th:href="@{/table}" href="deleteLater/table.html" class="nav-item nav-desktop">Рабочий стол</a>
  <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
</div>

<div class="content">
  <!-- Ссылка «Назад» -->
  <a th:href="@{/taskLists}" class="back-link">← Назад к спискам задач</a>

  <!-- Заголовок с названием списка -->
  <h2 th:text="${taskList.title}"></h2>

  <p th:if="${#lists.isEmpty(taskList.tasks)}">
    В этом списке пока нет задач.
  </p>

  <div class="tasks-table" th:if="${not #lists.isEmpty(taskList.tasks)}">
    <div class="table-header">
      <h3>Задачи списка</h3>
    </div>
    <table>
      <thead>
      <tr>
        <th>№</th>
        <th>Название задачи</th>
        <th>Статус</th>
        <th>Дедлайн</th>
        <th>XP</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="task, taskStat : ${taskList.tasks}">
        <td th:text="${taskStat.count}"></td>
        <td>
          <a th:href="@{/tasks/details(id=${task.id})"
             th:text="${task.title}"
             style="font-weight: 500;"></a>
        </td>
        <td>
              <span th:class="${task.status == 'Completed'} ? 'status-completed' :
                      ${task.status == 'Overdue'} ? 'status-overdue' : 'status-pending'"
                    th:text="${task.status}"></span>
        </td>
        <td th:text="${#temporals.format(task.deadlineAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${task.points}"></td>
        <td class="actions">
          <a th:href="@{/tasks/edit(id=${task.id})" class="action-link action-edit">Редактировать</a>
          <a th:href="@{/tasks/delete(id=${task.id})"
             onclick="return confirm('Удалить задачу?');"
             class="action-link action-delete">Удалить</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer">
  © Все-приложения, 2025
</div>
</body>
</html>
