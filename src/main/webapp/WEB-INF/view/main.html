<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title>Задачи</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #00b3a8;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 30px;
    }

    .nav-item {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .nav-main { background-color: #4CAF50; }
    .nav-tasks { background-color: #2196F3; }
    .nav-task-lists { background-color: #FF9800; }
    .nav-profile { background-color: #9C27B0; }
    .nav-notifications { background-color: #CCCCFF; }

    .nav-item:hover {
      opacity: 0.9;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tasks-table {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 20px 0;
    }

    .table-header {
      background-color: #e8f4f3;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-task-btn {
      background-color: #00b3a8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .add-task-btn:hover {
      background-color: #009a90;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background-color: #00b3a8;
      color: white;
    }

    th {
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background-color: #f5f9f9;
    }

    td {
      padding: 12px 10px;
    }

    .status-pending { color: #ff9800; font-weight: 500; }
    .status-completed { color: #4CAF50; font-weight: 500; }
    .status-overdue { color: #f44336; font-weight: 500; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-link {
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 0.85rem;
    }

    .action-start { background-color: #8bc34a; color: white; }
    .action-edit { background-color: #2196f3; color: white; }
    .action-delete { background-color: #f44336; color: white; }

    .action-link:hover {
      opacity: 0.9;
    }

    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .actions-container a, span {
      display: block;
      text-align: center;
      padding: 4px 8px;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
          background-color: #00b3a8;
          color: white;
          text-align: center;
          padding: 15px;
          position: fixed;
          bottom: 0;
          width: 100%;
          font-size: 0.9rem;
    }

    .filters { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
    .filter-group { display: inline-block; margin-right: 15px; }
    .pagination { margin-top: 20px; text-align: center; }
    .page-link { margin: 0 5px; padding: 5px 10px; border: 1px solid #ddd; text-decoration: none; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="logo">
    <!--        <img th:src="@{/images/logo.png}" alt="Логотип" width="100" />-->
    <p>TimeManagementApp</p>
  </div>

  <!-- Всегда отображаемая вкладка "Главная" -->
  <a th:href="@{/main}" href="main.html" class="nav-item nav-main">Главная</a>

  <!-- Вкладки для неавторизованного пользователя -->
  <div th:if="${session.user == null}">
    <a th:href="@{/login}" href="login.html" class="nav-item nav-login">Войти</a>
    <a th:href="@{/register}" href="register.html" class="nav-item nav-register">Зарегистрироваться</a>
  </div>

  <!-- Вкладки для авторизованного пользователя -->
  <div th:if="${session.user != null}">
    <a th:href="@{/tasks}" href="tasks.html" class="nav-item nav-tasks">Задачи</a>
    <a th:href="@{/taskLists}" href="taskLists.html" class="nav-item nav-task-lists">Списки задач</a>
    <a th:href="@{/notifications}" href="notifications.html" class="nav-item nav-notifications">Уведомления</a>
    <a th:href="@{/profile}" href="profile.html" class="nav-item nav-profile">Профиль</a>
  </div>
</div>

<div class="content">
  <div class="tasks-table">
    <div class="table-header">
      <h2>Веб-приложение "Тайм-менеджмент"</h2>
    </div>
  </div>
</div>

<div class="footer">
  © TimeManagementApp, 2025-2026
</div>
</body>
</html>
